<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Sử dụng bộ chọn CSS</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

    <main class="container">

        <!-- ID SELECTOR -->

        <h1 id="main-title">
            Trang web của tôi
        </h1>


        <!-- CLASS SELECTOR -->

        <p class="intro">
            Xin chào! Tôi là một sinh viên đang học lập trình web.
            Tôi muốn nâng cao kỹ năng HTML và CSS để có thể
            xây dựng các trang web đẹp và dễ sử dụng.
        </p>


        <section class="hobbies">

            <h2>Sở thích của tôi</h2>

            <ul>

                <li class="hobby hobby-1">
                    Lập trình
                </li>

                <li class="hobby hobby-2">
                    Nghe nhạc
                </li>

                <li class="hobby hobby-3">
                    Du lịch
                </li>

            </ul>

        </section>


        <!-- BUTTON -->

        <button id="action-button">
            Nhấn vào đây
        </button>

    </main>

</body>

</html>
