<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Responsive Image Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Responsive Image Gallery</h1>

        <p class="intro">
            Thay đổi kích thước cửa sổ trình duyệt
            để xem Gallery tự động thay đổi bố cục.
        </p>

        <div class="gallery-container">

            <div class="gallery-item">

                <div class="image image-1">
                    <span>Mountain</span>
                </div>

                <div class="description">
                    Phong cảnh núi
                </div>

            </div>

            <div class="gallery-item">

                <div class="image image-2">
                    <span>Forest</span>
                </div>

                <div class="description">
                    Khu rừng xanh
                </div>

            </div>

            <div class="gallery-item">

                <div class="image image-3">
                    <span>Ocean</span>
                </div>

                <div class="description">
                    Biển xanh
                </div>

            </div>

            <div class="gallery-item">

                <div class="image image-4">
                    <span>Sunset</span>
                </div>

                <div class="description">
                    Hoàng hôn
                </div>

            </div>

            <div class="gallery-item">

                <div class="image image-5">
                    <span>Lake</span>
                </div>

                <div class="description">
                    Hồ nước
                </div>

            </div>

            <div class="gallery-item">

                <div class="image image-6">
                    <span>City</span>
                </div>

                <div class="description">
                    Thành phố
                </div>

            </div>

            <div class="gallery-item">

                <div class="image image-7">
                    <span>Flower</span>
                </div>

                <div class="description">
                    Vườn hoa
                </div>

            </div>

            <div class="gallery-item">

                <div class="image image-8">
                    <span>Snow</span>
                </div>

                <div class="description">
                    Tuyết trắng
                </div>

            </div>

        </div>

    </div>

</body>

</html>
